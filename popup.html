<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rsearch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container" aria-label="rsearch">
    <header class="search-bar">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="text" id="searchInput" aria-label="Search query" placeholder="Search your sites…" autocomplete="off">
      <button id="settingsBtnHeader" class="icon-button" title="Manage engines" aria-label="Manage engines">⚙</button>
      <button id="closePanelBtn" class="icon-button" title="Close (Esc)" aria-label="Close panel">×</button>
    </header>
    <div id="engineList" class="engine-list" role="group" aria-label="Search engines"></div>
    <div id="emptyEngines" class="empty-engines hidden">
      <h2>No search engines yet</h2>
      <p>Add your favorite sites or import an engine list to start searching.</p>
      <button id="getStartedBtn">Get started</button>
    </div>
    <footer>
      <div class="footer-info"><span class="brand">rsearch</span><span class="keyboard-help">↑ ↓ navigate · Space select · Enter search · Esc close</span></div>
      <div class="footer-actions">
        <button id="addCurrentWebsiteBtn" title="Add current website">＋ Add website</button>
        <button id="searchAllBtn">Search all</button>
        <button id="searchSelectedBtn" class="primary" disabled>Search selected</button>
      </div>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
